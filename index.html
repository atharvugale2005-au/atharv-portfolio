    // --- Animated Number Counter Hook ---
    const AnimatedCounter = ({ target, suffix = '', decimals = 0, duration = 1200 }) => {
      const [count, setCount] = useState(0);
      const [isVisible, setIsVisible] = useState(false);
      const domRef = useRef();

      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            setIsVisible(true);
            observer.disconnect();
          }
        }, { threshold: 0.2 });

        if (domRef.current) observer.observe(domRef.current);
        return () => observer.disconnect();
      }, []);

      useEffect(() => {
        if (!isVisible) return;
        let startTimestamp = null;
        const step = (timestamp) => {
          if (!startTimestamp) startTimestamp = timestamp;
          const progress = Math.min((timestamp - startTimestamp) / duration, 1);
          // Ease-out cubic
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = eased * target;
          setCount(current);
          if (progress < 1) {
            window.requestAnimationFrame(step);
          } else {
            setCount(target);
          }
        };
        window.requestAnimationFrame(step);
      }, [isVisible, target, duration]);

      return (
        <span ref={domRef} className="tabular-nums">
          {decimals > 0 ? count.toFixed(decimals) : Math.floor(count)}
          {suffix}
        </span>
      );
    };

          if (entry.isIntersecting) {
            setIsRevealed(true);
            observer.disconnect();
          }
        }, { threshold: 0.1 });

        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);

      return (
        <div
          ref={ref}
          style={{ transitionDelay: `${delay}ms` }}
          className={`reveal-init ${isRevealed ? 'reveal-visible' : ''} ${className}`}
        >
          {children}
        </div>
      );
    };

                      <button
                        onClick={() => copyToClipboard(personalInfo.email, "Email")}
                        className="p-1.5 rounded text-slate-400 hover:text-accent hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
                        title="Copy email"
                      >
                        <Icon name="copy" className="w-4 h-4" />
                      </button>
                    </div>
                  </Reveal>

                  {/* Phone Box */}
                  <Reveal delay={200}>
                    <div className="p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800/80 shadow-sm flex items-start justify-between card-interactive">
                      <div className="flex items-start gap-3">
                        <div className="p-2 rounded-lg bg-accent/10 text-accent">
                          <Icon name="phone" className="w-5 h-5" />
                        </div>
                        <div>
                          <span className="text-xs text-slate-400 font-medium">Phone / WhatsApp</span>
                          <a href={`tel:${personalInfo.phone}`} className="block text-sm font-semibold text-slate-900 dark:text-white hover:text-accent">
                            {personalInfo.phone}
                          </a>
                        </div>
                      </div>
                      <button
                        onClick={() => copyToClipboard(personalInfo.phone, "Phone number")}
                        className="p-1.5 rounded text-slate-400 hover:text-accent hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
                        title="Copy phone"
                      >
                        <Icon name="copy" className="w-4 h-4" />
                      </button>
                    </div>
                  </Reveal>

                  {/* LinkedIn Box */}
                  <Reveal delay={300}>
                    <a
                      href={personalInfo.linkedin}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800/80 shadow-sm flex items-center justify-between hover:border-accent transition-colors group card-interactive"
                    >
                      <div className="flex items-center gap-3">
                        <div className="p-2 rounded-lg bg-accent/10 text-accent">
                          <Icon name="linkedin" className="w-5 h-5" />
                        </div>
                        <div>
                          <span className="text-xs text-slate-400 font-medium">LinkedIn</span>
                          <p className="text-sm font-semibold text-slate-900 dark:text-white group-hover:text-accent">
                            {personalInfo.linkedinHandle}
                          </p>
                        </div>
                      </div>
                      <Icon name="external-link" className="w-4 h-4 text-slate-400 group-hover:text-accent group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" />
                    </a>
                  </Reveal>

                  {/* Location Info */}
                  <Reveal delay={400}>
                    <div className="p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800/80 shadow-sm flex items-center gap-3">
                      <div className="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500">
                        <Icon name="map-pin" className="w-5 h-5" />
                      </div>
                      <div>
                        <span className="text-xs text-slate-400 font-medium">Base Location</span>
                        <p className="text-sm font-semibold text-slate-900 dark:text-white">
                          {personalInfo.location}
                        </p>
                      </div>
                    </div>
                  </Reveal>

                </div>

                {/* Interactive Contact Form */}
                <Reveal delay={200} className="md:col-span-7">
                  <div className="bg-white dark:bg-slate-800/80 p-6 sm:p-8 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                    <h3 className="font-heading font-bold text-lg text-slate-900 dark:text-white mb-4">
                      Send a Message
                    </h3>
                    
                    {formSent ? (
                      <div className="p-6 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-center space-y-2 animate-slide-up">
                        <div className="inline-flex p-3 rounded-full bg-emerald-100 dark:bg-emerald-900 text-emerald-600 dark:text-emerald-300">
                          <Icon name="check" className="w-6 h-6" />
                        </div>
                        <h4 className="font-heading font-bold text-emerald-800 dark:text-emerald-300 text-base">
                          Message Prepared!
                        </h4>
                        <p className="text-xs text-emerald-700 dark:text-emerald-400">
                          Your email client has been launched with the drafted message. You can also reach out directly to atharvugale2005@gmail.com.
                        </p>
                        <button
                          onClick={() => setFormSent(false)}
                          className="mt-4 text-xs font-semibold text-emerald-700 dark:text-emerald-300 underline"
                        >
                          Send another note
                        </button>
                      </div>
                    ) : (
                      <form onSubmit={handleContactSubmit} className="space-y-4">
                        <div className="grid sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">
                              Your Name *
                            </label>
                            <input
                              type="text"
                              required
                              placeholder="e.g. John Doe"
                              value={contactForm.name}
                              onChange={e => setContactForm({ ...contactForm, name: e.target.value })}
                              className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-accent transition-shadow"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">
                              Your Email *
                            </label>
                            <input
                              type="email"
                              required
                              placeholder="e.g. john@example.com"
                              value={contactForm.email}
                              onChange={e => setContactForm({ ...contactForm, email: e.target.value })}
                              className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-accent transition-shadow"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">
                            Subject
                          </label>
                          <input
                            type="text"
                            placeholder="e.g. Internship Inquiry / Hardware Project"
                            value={contactForm.subject}
                            onChange={e => setContactForm({ ...contactForm, subject: e.target.value })}
                            className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-accent transition-shadow"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">
                            Message *
                          </label>
                          <textarea
                            required
                            rows="4"
                            placeholder="Write your note or project requirements..."
                            value={contactForm.message}
                            onChange={e => setContactForm({ ...contactForm, message: e.target.value })}
                            className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-accent transition-shadow"
                          ></textarea>
                        </div>

                        <button
                          type="submit"
                          className="w-full py-3 px-4 rounded-lg bg-accent hover:bg-accent-hover text-white font-medium text-xs uppercase tracking-wider transition-all shadow-sm hover:shadow hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2"
                        >
                          <Icon name="mail" className="w-4 h-4" />
                          <span>Send Message via Mail</span>
                        </button>
                      </form>
                    )}

                  </div>
                </Reveal>

              </div>

            </div>
          </section>

          {/* ========================================================= */}
          {/* FOOTER                                                    */}
          {/* ========================================================= */}
          <footer className="mt-auto py-8 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400 bg-white dark:bg-surface-900">
            <div className="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                © 2026 <span className="font-semibold text-slate-700 dark:text-slate-300">Atharv Ugale</span>. All rights reserved.
              </div>

              <div className="flex items-center gap-4 text-xs font-medium">
                <a href="#hero" className="hover:text-accent transition-colors">Top</a>
                <span>•</span>
                <a href={personalInfo.linkedin} target="_blank" rel="noopener noreferrer" className="hover:text-accent transition-colors">LinkedIn</a>
                <span>•</span>
                <a href={`mailto:${personalInfo.email}`} className="hover:text-accent transition-colors">Email</a>
              </div>
            </div>
          </footer>

          {/* Floating Back to Top Button */}
          {showBackToTop && (
            <a
              href="#hero"
              aria-label="Back to Top"
              className="fixed bottom-6 left-6 z-40 p-3 rounded-full bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shadow-lg hover:border-accent hover:text-accent hover:-translate-y-1 transition-all duration-200 animate-slide-up"
            >
              <Icon name="arrow-up" className="w-4 h-4" />
            </a>
          )}

        </div>
      );
    }

    // Mount the Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PortfolioApp />);
  </script>
</body>
</html>
